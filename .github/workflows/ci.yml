# linkstash-ai CI — 백엔드는 lint→build→단위테스트→통합테스트(Testcontainers)를 순서대로 게이트하고,
# 프론트는 lint+build만 가볍게 확인한다(M티어, 과설계 금지).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬 개발 버전(v24)에 맞춤 — backend/package.json의 engines.node와 일치.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: 단위 테스트 (Jest)
        run: npm test

      - name: 통합 테스트 (Testcontainers Postgres + supertest)
        # ubuntu-latest 러너에는 Docker가 기본 탑재되어 있어 Testcontainers가 별도 설정 없이 동작한다.
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
